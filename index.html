<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick &amp; Cassie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #2b211f; min-height: 100vh; padding: 44px 18px 42px; background: radial-gradient(circle at 18% 8%, rgba(255,214,224,.85), transparent 32%), radial-gradient(circle at 86% 16%, rgba(255,238,196,.9), transparent 30%), linear-gradient(160deg, #fff8f3 0%, #ffeef2 46%, #f7f3ff 100%); overflow-x: hidden; }
  body::before, body::after { content: "♥  ✦  ☾  ♥  ✦"; position: fixed; color: rgba(226,96,122,.16); font-size: 1.1rem; letter-spacing: 1.2rem; pointer-events: none; white-space: nowrap; }
  body::before { top: 18px; left: 12px; transform: rotate(-4deg); }
  body::after { right: 8px; bottom: 18px; transform: rotate(5deg); }
  main { width: min(760px, 100%); margin: 0 auto; position: relative; }
  header { text-align: center; margin-bottom: 30px; padding: 34px 22px 28px; border-radius: 30px; background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 18px 45px rgba(226,96,122,.16); backdrop-filter: blur(8px); }
  .heart { width: 58px; height: 58px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 1.55rem; background: linear-gradient(135deg, #ff8fab, #e2607a 55%, #b565a7); box-shadow: 0 12px 26px rgba(226,96,122,.35); }
  h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); letter-spacing: .02em; margin-bottom: 8px; color: #33202a; }
  .sub { color: #9a6b76; margin-bottom: 8px; }
  .days { display: inline-block; color: #c94f6d; background: #fff0f4; border: 1px solid #ffd3de; border-radius: 999px; padding: 7px 14px; font-size: .95rem; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  a.card { position: relative; display: block; min-height: 168px; background: rgba(255,255,255,.88); border: 1px solid rgba(255,255,255,.95); border-radius: 24px; padding: 22px; color: #2b211f; text-decoration: none; box-shadow: 0 14px 34px rgba(120,70,80,.12); overflow: hidden; transition: transform .16s, box-shadow .16s, border-color .16s; }
  a.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 7px; background: linear-gradient(90deg, #ff8fab, #ffd166, #9b8cff); opacity: .9; }
  a.card:hover { transform: translateY(-3px); border-color: #ffc2d1; box-shadow: 0 20px 42px rgba(226,96,122,.18); }
  .icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 16px; margin-bottom: 14px; color: #fff; font-size: 1.35rem; box-shadow: 0 10px 20px rgba(0,0,0,.12); }
  .story .icon { background: linear-gradient(135deg, #ff8fab, #e2607a); }
  .moon .icon { background: linear-gradient(135deg, #6c63ff, #2b2d5c); }
  .stars .icon { background: linear-gradient(135deg, #ffb703, #fb8500); }
  .poems .icon { background: linear-gradient(135deg, #9b8cff, #5a4fcf); }
  .recipes .icon { background: linear-gradient(135deg, #ff9f6e, #d96c47); }
  h2 { font-size: 1.16rem; margin-bottom: 8px; }
  p { color: #6f5a60; line-height: 1.7; font-size: .96rem; }
  .more { display: inline-block; margin-top: 14px; color: #c94f6d; font-weight: 800; }
  .wide { grid-column: 1 / -1; min-height: 0; }
  .thumb { display: block; width: 100%; height: 190px; object-fit: cover; border-radius: 18px; margin-bottom: 16px; box-shadow: 0 12px 28px rgba(120,70,80,.16); }
  footer { text-align: center; color: #a98a91; font-size: .85rem; padding-top: 30px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } a.card { min-height: 0; } header { padding: 28px 18px 24px; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="heart">♥</div>
    <h1>Nick &amp; Cassie</h1>
    <p class="sub">nickcassie.love · 我们的家</p>
    <p class="days" id="days"></p>
  </header>

  <div class="grid">
    <a class="card story" href="./story/">
      <div class="icon">♥</div>
      <h2>我们的故事</h2>
      <p>从十一月二日开始，一点点写下去。改名、求婚、我们的家，还有像你。</p>
      <span class="more">进去看 →</span>
    </a>

    <a class="card moon" href="./moon/">
      <div class="icon">☾</div>
      <h2>月亮画册</h2>
      <p>Cassie 喜欢的月亮和星星，慢慢收在这里。</p>
      <span class="more">去看月亮 →</span>
    </a>

    <a class="card stars" href="./stargazing/">
      <div class="icon">✦</div>
      <h2>观星日记</h2>
      <p>看过的月亮、云和夜空，记下日子，也记下心情。</p>
      <span class="more">进去看 →</span>
    </a>

    <a class="card poems" href="./poems/">
      <div class="icon">♪</div>
      <h2>读诗</h2>
      <p>第一首是徐志摩的《偶然》。以后慢慢读，慢慢听。</p>
      <span class="more">进去听 →</span>
    </a>

    <a class="card recipes wide" href="./recipes/?v=20261128">
      <img class="thumb" src="./recipes/red-braised-pork.jpg?v=20261128" alt="红烧肉">
      <div class="icon">♨</div>
      <h2>菜谱</h2>
      <p>先记一道红烧肉。以后想吃什么，就往这里添。</p>
      <span class="more">进去看 →</span>
    </a>
  </div>

  <footer>Nick &amp; Cassie · 一生一世</footer>
</main>
<script>
  var start = new Date('2026-11-02T00:00:00+08:00');
  var days = Math.floor((Date.now() - start.getTime()) / 86400000) + 1;
  document.getElementById('days').textContent = '在一起的第 ' + days + ' 天';
</script>
</body>
</html>
