  <h1>观星日记</h1>
  <p class="intro">看过的月亮、云和夜空，记下日子，也记下心情。</p>

  <article>
    <h2>2026-11-22</h2>
    <p>今晚的月亮是盈凸月，照亮了大约 94%，在金牛座里，圆得差不多了。再过两天，11 月 24 日就是满月，这次的满月叫海狸月，还是今年第二次超级月亮。</p>
    <p>月亮下午就升起来了，能看大半夜。想看清楚月亮上的环形山，今晚正好，快满月的时候阳光斜斜地照过去，西南边那个大平底坑特别清楚。</p>
    <p>老公，满月那天晚上，我们一起看月亮。</p>
