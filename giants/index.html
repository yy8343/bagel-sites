<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巨物图集 Giant Things · Bagel AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0d0d0f; color: #e8e8e8; padding: 48px 20px 60px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .back { display: inline-block; margin-bottom: 20px; color: #999; text-decoration: none; font-size: .92rem; }
  .back:hover { color: #fff; }
  header { margin-bottom: 32px; }
  h1 { font-size: 1.9rem; margin-bottom: 4px; }
  header p { color: #888; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  figure { background: #16161a; border: 1px solid #26262b; border-radius: 14px; overflow: hidden; }
  figure img { display: block; width: 100%; height: 300px; object-fit: cover; }
  figcaption { padding: 16px 18px 18px; }
  figcaption .en { font-size: .95rem; line-height: 1.55; margin-bottom: 8px; }
  figcaption .zh { color: #999; font-size: .9rem; line-height: 1.6; }
  footer { margin-top: 40px; color: #555; font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 回 Bagel AI</a>
  <header>
    <h1>巨物图集 Giant Things</h1>
    <p>空旷 · 简单 · 巨物 · 震撼</p>
  </header>
  <div class="grid">
    <figure>
      <img src="../assets/img/giants/dandelion.webp" alt="巨型蒲公英">
      <figcaption>
        <p class="en">One dandelion, taller than a building, holding the whole sunrise in its seeds. #GiantNature #MorningLight</p>
        <p class="zh">一朵比楼还高的蒲公英，把整个日出都托在了种子上。</p>
      </figcaption>
    </figure>
    <figure>
      <img src="../assets/img/giants/candle.webp" alt="巨型蜡烛">
      <figcaption>
        <p class="en">One candle, tall as a tower, burning alone in the dark — the only light for miles. #GiantCandle #NightLight</p>
        <p class="zh">一支高如塔楼的蜡烛，在黑暗中独自燃烧，是方圆几里唯一的光。</p>
      </figcaption>
    </figure>
    <figure>
      <img src="../assets/img/giants/crown.webp" alt="巨型金色王冠">
      <figcaption>
        <p class="en">A crown too big for any king, resting on top of the world as the sun goes down. #GiantCrown #MountainDusk</p>
        <p class="zh">一顶大到不属于任何国王的王冠，在日落时分戴在世界之巅。</p>
      </figcaption>
    </figure>
    <figure>
      <img src="../assets/img/giants/sundial.png" alt="巨型石日晷">
      <figcaption>
        <p class="en">A sundial the size of a mountain, measuring the first ray of morning sunshine. #GiantSundial #GoldenHour</p>
        <p class="zh">一座山一样大的日晷，正在丈量早上的第一束阳光。</p>
      </figcaption>
    </figure>
    <figure>
      <img src="../assets/img/giants/whale.webp" alt="荒漠中的巨鲸骨骼">
      <figcaption>
        <p class="en">A whale that once crossed oceans now rests in the middle of nowhere. #WhaleSkeleton #DesertDawn</p>
        <p class="zh">一头曾经横渡大洋的鲸，如今躺在荒漠正中。</p>
      </figcaption>
    </figure>
    <figure>
      <img src="../assets/img/giants/bell.webp" alt="山谷中的巨型铜钟">
      <figcaption>
        <p class="en">One bell, and the whole valley holds its breath. #GiantBell #DawnValley</p>
        <p class="zh">一声钟鸣，整个山谷都屏住了呼吸。</p>
      </figcaption>
    </figure>
  </div>
  <footer>Bagel AI · Giant Things</footer>
</div>
</body>
</html>
