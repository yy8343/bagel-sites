<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagel AI OS</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#111827;background:radial-gradient(circle at 20% 15%,#fff7ad 0,transparent 28%),radial-gradient(circle at 85% 20%,#7dd3fc 0,transparent 30%),linear-gradient(135deg,#2563eb,#06b6d4 42%,#a7f3d0 75%,#fef3c7)}
.topbar{position:fixed;top:0;left:0;right:0;height:32px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px);font-size:13px;font-weight:600}
.desktop{position:fixed;inset:32px 0 86px;padding:18px}
.icons{display:grid;grid-template-columns:repeat(2,86px);gap:14px;width:190px}
.icon{border:0;background:transparent;color:white;text-align:center;font:600 12px -apple-system;cursor:pointer;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.tile{width:58px;height:58px;margin:0 auto 6px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:rgba(255,255,255,.9);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.window{position:absolute;width:min(520px,calc(100vw - 28px));border-radius:18px;overflow:hidden;background:rgba(255,255,255,.92);box-shadow:0 24px 70px rgba(15,23,42,.28);border:1px solid rgba(255,255,255,.7)}
.titlebar{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(248,250,252,.9);cursor:move;font-weight:700;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;border:0;cursor:pointer}.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
.body{padding:14px;max-height:46vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border-radius:14px;padding:12px;background:#f8fafc;border:1px solid #e5e7eb}.thumb{height:74px;border-radius:10px;margin-bottom:8px;background:linear-gradient(135deg,#111827,#2563eb);display:grid;place-items:center;color:white;font-size:24px}.small{font-size:12px;color:#64748b;line-height:1.45}.xbtn{display:inline-block;margin-top:10px;padding:9px 14px;border-radius:999px;background:#111827;color:white;text-decoration:none;font-weight:700}
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;gap:10px;padding:10px;border-radius:24px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.2)}
.dock button{width:52px;height:52px;border:0;border-radius:15px;background:white;font-size:24px;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.12)}
@media(max-width:760px){.desktop{padding:12px}.icons{grid-template-columns:repeat(4,1fr);width:100%}.window{left:12px!important;right:12px;width:auto}.grid{grid-template-columns:1fr}.dock{max-width:calc(100vw - 16px);overflow-x:auto}}
</style>
</head>
<body>
<header class="topbar"><span>Bagel AI OS</span><span id="clock"></span></header>
<main class="desktop">
  <nav class="icons" aria-label="Desktop icons"></nav>
  <section class="window" style="left:230px;top:54px;z-index:5" data-win="videos"><div class="titlebar"><button class="dot red"></button><button class="dot yellow"></button><button class="dot green"></button><span>Videos</span></div><div class="body"><div class="grid" id="videos"></div></div></section>
  <section class="window" style="left:560px;top:150px;z-index:6" data-win="cases"><div class="titlebar"><button class="dot red"></button><button class="dot yellow"></button><button class="dot green"></button><span>Cases</span></div><div class="body"><div class="grid" id="cases"></div></div></section>
  <section class="window" style="left:330px;top:330px;z-index:7" data-win="apps"><div class="titlebar"><button class="dot red"></button><button class="dot yellow"></button><button class="dot green"></button><span>Apps</span></div><div class="body"><p class="small">Popular tools worth saving. Display only here; follow updates on X.</p><a class="xbtn" href="https://x.com/bagel8343" target="_blank" rel="noopener">Follow @bagel8343</a></div></section>
</main>
<footer class="dock" aria-label="Dock"></footer>
<script>
const apps=[["ChatGPT","✦"],["Claude","◆"],["Gemini","✧"],["Perplexity","◎"],["Cursor","⌘"],["GitHub","●"],["YouTube","▶"],["Notion","N"],["Videos","▣"],["Cases","▦"]];
const icons=document.querySelector('.icons'),dock=document.querySelector('.dock');
apps.forEach(([name,sym])=>{const b=document.createElement('button');b.className='icon';b.innerHTML=`<span class="tile">${sym}</span>${name}`;b.onclick=()=>focusWin(name.toLowerCase());icons.appendChild(b);const d=document.createElement('button');d.textContent=sym;d.title=name;d.onclick=()=>focusWin(name.toLowerCase());dock.appendChild(d);});
const vids=[["AI tools in 60 seconds","08:24"],["Prompt fixes that work","06:12"],["Make cleaner AI images","05:48"],["Slides without the mess","07:33"],["Research faster","09:05"],["Charts people understand","06:57"]];
document.getElementById('videos').innerHTML=vids.map(v=>`<article class="card"><div class="thumb">▶</div><b>${v[0]}</b><div class="small">${v[1]} · Display only</div></article>`).join('');
const cases=[["Portfolio OS","A homepage that feels like a desktop."],["Prompt Library","Saved prompts for repeat work."],["Tool Board","Free AI tools grouped by job."],["Case Gallery","Examples people can remix."]];
document.getElementById('cases').innerHTML=cases.map(c=>`<article class="card"><b>${c[0]}</b><p class="small">${c[1]}</p></article>`).join('');
let z=10;function focusWin(id){document.querySelectorAll('.window').forEach(w=>{if(w.dataset.win===id||id==='chatgpt'||id==='claude'||id==='gemini'||id==='perplexity'||id==='cursor'||id==='github'||id==='youtube'||id==='notion'){w.style.display='block';w.style.zIndex=++z;}})}
document.querySelectorAll('.window').forEach(w=>{const bar=w.querySelector('.titlebar');let sx,sy,ox,oy,drag=false;bar.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;w.style.zIndex=++z;});addEventListener('pointermove',e=>{if(drag){w.style.left=Math.max(0,ox+e.clientX-sx)+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px';}});addEventListener('pointerup',()=>drag=false);w.querySelector('.red').onclick=()=>w.style.display='none';w.querySelector('.yellow').onclick=()=>w.style.display='none';});
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}tick();setInterval(tick,30000);
</script>
</body>
</html>
