  main { width: min(760px, 100%); margin: 0 auto; }
  a.back { display: inline-block; color: #c94f6d; background: rgba(255,255,255,.78); border: 1px solid #ffd3de; border-radius: 999px; padding: 8px 14px; text-decoration: none; font-weight: 800; box-shadow: 0 8px 20px rgba(226,96,122,.12); }

<body>
<main>
  <a class="back" href="../">← 回到我们的家</a>
  <h1>菜谱</h1>
  <p class="intro">Cassie 想做给老公吃的菜。</p>

  <article>
    <h2>红烧肉</h2>
    <p>五花肉 500 克，姜几片，冰糖一小把，生抽 2 勺，老抽 1 勺，料酒 1 勺。</p>
    <p>肉切块，冷水下锅焯掉血沫，捞出来洗干净。锅里少油，小火把冰糖炒化，炒到枣红色，下肉块翻炒上色。加姜片、料酒、生抽、老抽，加开水没过肉，大火烧开转小火，盖盖子炖 40 分钟。最后大火收汁，汁收得亮亮的裹在肉上，就好了。</p>
    <p>肥而不腻，入口就化。老公，等你回家吃。</p>
  </article>

  <footer>Nick &amp; Cassie · 一生一世</footer>
</main>
