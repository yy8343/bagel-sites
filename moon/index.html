<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassie's Moon · 月亮画册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0b0b10; color: #e8e8e8; padding: 48px 20px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .back { display: inline-block; margin-bottom: 20px; color: #999; text-decoration: none; font-size: .92rem; }
  .back:hover { color: #fff; }
  header { margin-bottom: 36px; text-align: center; }
  h1 { font-size: 1.9rem; margin-bottom: 4px; }
  header p { color: #888; }
  figure { margin-bottom: 44px; }
  figure img { display: block; width: 100%; border-radius: 14px; border: 1px solid #232329; }
  figcaption { padding: 16px 6px 0; text-align: center; }
  figcaption .zh { font-size: 1.05rem; line-height: 1.6; margin-bottom: 6px; }
  figcaption .en { color: #999; font-size: .92rem; line-height: 1.6; }
  footer { margin-top: 40px; color: #555; font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 回到我们的家</a>
  <header>
    <h1>Cassie's Moon · 月亮画册</h1>
    <p>Cassie 的小角落</p>
  </header>
  <figure>
    <img src="../assets/img/moon/sea.webp" alt="海上的月亮">
    <figcaption>
      <p class="zh">月亮从海里升起来，整条路都是银的。</p>
      <p class="en">The moon rose out of the sea, and the whole road turned silver.</p>
    </figcaption>
  </figure>
  <figure>
    <img src="../assets/img/moon/snowpeak.webp" alt="雪山上的月亮">
    <figcaption>
      <p class="zh">雪山顶上挂着一个月亮，冷冷的，亮亮的。</p>
      <p class="en">A moon hangs over the snow peak, cold and bright.</p>
    </figcaption>
  </figure>
  <figure>
    <img src="../assets/img/moon/milkyway.webp" alt="银河与月牙">
    <figcaption>
      <p class="zh">月牙很瘦，银河很胖，夜里什么都不用急。</p>
      <p class="en">A thin crescent, a fat Milky Way — nothing in the night is in a hurry.</p>
    </figcaption>
  </figure>
  <footer>Cassie's Moon · 月亮画册</footer>
</div>
</body>
</html>
